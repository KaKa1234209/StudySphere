<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySphere - Đăng ký tài khoản</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="auth-brand" href="index.html">
            <img src="../images/favicon.png" alt="" onerror="this.src='/images/favicon.png'">
            <span>Study<b>Sphere</b></span>
        </a>
        <h1>Tạo tài khoản mới</h1>
        <p class="sub">Bắt đầu quản lý môn học, ghi chú và mục tiêu thông minh cùng StudySphere.</p>

        <form class="auth-form" id="registerForm" novalidate>
            <label>Họ và tên
                <input type="text" id="fullName" class="auth-input" placeholder="VD: Nguyễn Văn A" required>
            </label>
            <label>Email
                <input type="email" id="email" class="auth-input" placeholder="ban@email.com" required>
            </label>
            <label>Mật khẩu (tối thiểu 6 ký tự)
                <input type="password" id="password" class="auth-input" placeholder="abc..." required>
            </label>
            <p class="auth-error" id="authError" role="alert"></p>
            <button type="submit" class="auth-btn">Đăng ký tài khoản</button>
        </form>

        <div class="auth-foot">
            Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
