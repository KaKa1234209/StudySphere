<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySphere - Tổng quan</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/studyflow.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-wrapper">
            <header class="top-header" id="topbar"></header>

            <div class="dashboard-grid">
                <!-- Banner + lịch -->
                <section class="card banner-card">
                    <div class="banner-content">
                        <h3 id="banner-hello">Good morning!</h3>
                        <p id="banner-text"></p>
                        <button class="btn-ready" id="btn-ready">Ready!</button>
                    </div>
                    <div class="mini-calendar">
                        <div class="calendar-month-title" id="calendar-month-title"></div>
                        <div class="calendar-header">
                            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                        </div>
                        <div class="calendar-days" id="calendar-days"></div>
                    </div>
                </section>

                <!-- Nhiệm vụ hôm nay -->
                <section class="card tasks-card">
                    <div class="card-header"><h3>Today's Tasks</h3></div>
                    <ul class="task-list" id="task-list"></ul>
                    <div class="add-task-container">
                        <div class="input-task-box">
                            <button class="btn-add-icon" id="btn-add-task" aria-label="Thêm nhiệm vụ"><i class="fa-solid fa-plus"></i></button>
                            <input type="text" id="task-input" maxlength="100" placeholder="Thêm nhiệm vụ mới">
                        </div>
                        <input type="time" id="task-time" class="task-time-input" aria-label="Giờ thực hiện" hidden>
                        <button class="icon-sub-btn" id="btn-task-time" title="Hẹn giờ" aria-label="Hẹn giờ"><i class="fa-regular fa-clock"></i></button>
                        <div class="category-select-wrapper">
                            <select class="category-select" id="task-category" aria-label="Nhãn nhiệm vụ">
                                <option value="Work">• Work</option>
                                <option value="Study">• Study</option>
                                <option value="Personal">• Personal</option>
                            </select>
                        </div>
                        <button class="icon-sub-btn" id="btn-task-tag" title="Chọn nhãn" aria-label="Chọn nhãn"><i class="fa-solid fa-tag"></i></button>
                    </div>
                </section>

                <!-- Thời gian học trong tuần -->
                <section class="card chart-card">
                    <h3>Weekly Productivity Analysis</h3>
                    <div class="chart-container">
                        <span class="target-line-label" id="chart-max">1h</span>
                        <div class="bar-chart" id="bar-chart"></div>
                    </div>
                </section>

                <!-- Hiệu suất nhiệm vụ -->
                <section class="card performance-card">
                    <div class="card-header-sub"><h3>Task Performance</h3><span class="sub-label">Today</span></div>
                    <div class="circle-progress-wrapper">
                        <svg class="progress-ring" width="120" height="120">
                            <circle class="progress-ring__circle-bg" stroke-width="10" fill="transparent" r="48" cx="60" cy="60"/>
                            <circle class="progress-ring__circle" id="ring" stroke-width="10" stroke-dasharray="301.59" stroke-dashoffset="301.59" fill="transparent" r="48" cx="60" cy="60"/>
                        </svg>
                        <span class="percentage" id="ring-pct">0%</span>
                    </div>
                    <div class="legend"><span class="dot"></span><span id="ring-legend"></span></div>
                </section>

                <!-- Pomodoro -->
                <section class="card pomodoro-card" id="pomo-card">
                    <div class="pomo-header">
                        <h3>Pomodoro Timer</h3>
                        <div class="pomo-select-box"><select class="pomo-select" id="pomo-subject" aria-label="Môn đang học"></select></div>
                    </div>
                    <div class="hourglass-wrapper"><i class="fa-solid fa-hourglass-half hourglass-icon"></i></div>
                    <div class="timer-controls-row">
                        <button class="btn-time-adjust" id="btn-minus" aria-label="Giảm 5 phút">-</button>
                        <span class="time-display-text" id="pomo-time">25:00</span>
                        <button class="btn-time-adjust" id="btn-plus" aria-label="Tăng 5 phút">+</button>
                    </div>
                    <button class="btn-pomo-start" id="btn-pomo-start">Start</button>
                    <p class="pomo-total" id="pomo-total"></p>
                </section>

                <!-- Danh sách nhắc không dùng -->
                <section class="card blocklist-card">
                    <div class="card-header">
                        <h3>Block List</h3>
                        <button class="btn-plus" id="btn-add-block" aria-label="Thêm ứng dụng"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div class="app-icons" id="block-icons-container"></div>
                    <p class="block-note">Danh sách ứng dụng bạn muốn tránh khi học. Trang web không thể chặn ứng dụng thật.</p>
                </section>
            </div>
        </main>
    </div>

    <script src="js/components.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
