<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8c7ad0">
    <title>StudySphere - Môn học</title>
    <link rel="icon" type="image/svg+xml" href="../images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/studyflow.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-wrapper">
            <header class="top-header" id="topbar"></header>

            <div class="sj-page">
                <!-- Banner đầu trang -->
                <section class="sj-hero">
                    <div class="sj-hero-text">
                        <span class="sj-eyebrow">QUẢN LÝ MÔN HỌC</span>
                        <h1>Chào bạn, hôm nay học gì nào?</h1>
                        <p>Sắp xếp các môn trong học kỳ để không bỏ lỡ bài tập và deadline nào.</p>
                        <button class="sj-btn-white" id="btnAddHero"><i class="fa-solid fa-plus"></i> Thêm môn học</button>
                    </div>
                    <div class="sj-count"><b id="heroCount">0</b><span>môn học</span></div>
                </section>

                <!-- Danh sách môn học -->
                <section class="sj-list">
                    <div class="sj-list-head">
                        <div>
                            <h2>Danh sách môn học</h2>
                            <p id="countText">0 môn học</p>
                        </div>
                        <input type="search" id="searchInput" class="sj-search"
                               placeholder="Tìm theo tên môn học hoặc giáo viên" aria-label="Tìm môn học">
                    </div>
                    <div id="subjectList"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- Hộp thoại thêm / sửa -->
    <dialog id="dlg" class="dlg">
        <form id="form" novalidate>
            <h3 id="dlg-title">Thêm môn học</h3>
            <label>Mã môn <input id="f-code" class="field" maxlength="20" placeholder="VD: MATH101"></label>
            <label>Tên môn học <input id="f-name" class="field" maxlength="100" placeholder="VD: Toán học"></label>
            <label>Giáo viên (không bắt buộc) <input id="f-teacher" class="field" maxlength="100" placeholder="VD: Cô Lan"></label>
            <p class="form-error" id="f-error" role="alert"></p>
            <div class="dlg-actions">
                <button type="button" class="btn-soft" id="btn-cancel">Hủy</button>
                <button type="submit" class="btn-primary">Lưu</button>
            </div>
        </form>
    </dialog>

    <script src="js/components.js"></script>
    <script src="js/subjects.js"></script>
</body>
</html>
