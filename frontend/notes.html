<!doctype html>
<html lang="vi">
<head>

  <title>NoteHub _ Ghi chú</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/notehub.css">
</head>
<body>
  <header class="top">

  <script src="js/components.js"></script>
